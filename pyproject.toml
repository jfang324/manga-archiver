[tool.poetry]
name = "mangadex-downloader"
version = "1.0.0"
description = "A Python package for downloading manga from MangaDex"
authors = ["Jeffery Fang <Jefferyfang324@gmail.com>"]
readme = "README.md"
repository = "https://github.com/jfang324/mangadex-downloader"

[tool.poetry.dependencies]
python = ">=3.10 ,<4.0"
aiohttp = {extras = ["speedups"], version = "^3.10.5"}
pillow = "^10.4.0"
textual = "^8.1.1"
google-auth = "^2.35.0"
google-auth-oauthlib = "^1.2.1"
google-api-python-client = "^2.100.0"
requests = "^2.33.1"

[tool.poetry.scripts]
mangadex-downloader = "mangadex_downloader.main:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
coverage = "^7.6.1"
pytest-asyncio = "^0.24.0"
ruff = "^0.15.7"
pyright = "^1.1.408"
pre-commit = "^4.5.1"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    "*/cli/*",
    "*/tests/*",
    "*/screens/*",
    "*/db/*",
    "*/repositories/*",
    "*/pipeline_manager.py",
]
source = ["src"]

[tool.coverage.report]
omit = [
    "*/cli/*",
    "*/screens/*",
    "*/db/*",
    "*/repositories/*",
    "*/pipeline_manager.py",
    "*/app.py",
]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
indent-width = 4
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20", "S", "PERF", "FIX", "ARG", "D415", "D401"]
ignore = ["E501", "B008", "PTH110", "PTH112", "PTH113", "PTH118", "PTH119", "PTH208", "PTH109", "B904", "T201"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/mangadex_downloader/utils/auth/google_drive/*.py" = ["S105"]
"src/mangadex_downloader/workers/base.py" = ["S311"]
"src/mangadex_downloader/workers/notification_worker.py" = ["PERF203"]
"src/mangadex_downloader/integrations/content_providers/mangadex/client.py" = ["PERF401"]

[tool.ruff.lint.isort]
known-first-party = ["mangadex_downloader"]

[tool.ruff.format]
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
quote-style = "double"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.pyright]
include = ["src"]
exclude = ["**/tests", "**/__pycache__", "**/.*"]
venvPath = "."
venv = ".venv"
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.9"
typeCheckingMode = "basic"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
