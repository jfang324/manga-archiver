[tool.poetry]
name = "manga-archiver"
version = "1.5.5"
description = "A terminal-based manga downloader and archiver"
authors = ["Jeffery Fang <Jefferyfang324@gmail.com>"]
readme = "README.md"
repository = "https://github.com/jfang324/manga-archiver"

[tool.poetry.dependencies]
python = ">=3.10 ,<4.0"
aiohttp = {extras = ["speedups"], version = "^3.14.0"}
pillow = "^12.2.0"
textual = "^8.1.1"
google-auth = "^2.35.0"
google-api-python-client = "^2.100.0"
requests = "^2.33.1"
ebooklib = "^0.20"
cryptography = "^50.0.0"
tqdm = "^4.67.3"

[tool.poetry.scripts]
manga-archiver = "manga_archiver.main:main"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
coverage = "^7.6.1"
pytest-asyncio = "^1.3.0"
ruff = "^0.15.11"
pyright = "^1.1.409"
pre-commit = "^4.5.1"
pip-audit = "^2.10.0"
setuptools = "^83.0.0"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/screens/*",
    "*/db/*",
    "*/repositories/*",
]
source = ["src"]

[tool.coverage.report]
omit = [
    "*/screens/*",
    "*/db/*",
    "*/repositories/*",
]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
indent-width = 4
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20", "S", "PERF", "FIX", "ARG", "D415", "D401", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206", "ANN401", "ASYNC100", "ASYNC109", "RUF100", "SIM102", "SIM103", "RET", "T100", "LOG014"]
ignore = ["E501", "B008", "PTH110", "PTH112", "PTH113", "PTH118", "PTH119", "PTH208", "PTH109", "B904", "T201"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["manga_archiver"]

[tool.ruff.format]
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
quote-style = "double"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.pyright]
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/.venv",
    "**/dist",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
