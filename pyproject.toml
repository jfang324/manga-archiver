[tool.poetry]
name = "mangadex-downloader"
version = "0.1.0"
description = "A Python package for downloading manga from MangaDex"
authors = ["Jeffery Fang <Jefferyfang324@gmail.com>"]
readme = "README.md"
repository = "https://github.com/jfang324/mangadex-downloader"

[tool.poetry.dependencies]
python = ">=3.9"
python-dotenv = "^1.0.1"
aiohttp = {extras = ["speedups"], version = "^3.10.5"}
pillow = "^10.4.0"
windows-curses = {version = "^2.3.3", markers = "sys_platform == 'win32'"}

[tool.poetry.scripts]
mangadex-downloader = "mangadex_downloader.main:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
coverage = "^7.6.1"
pytest-asyncio = "^0.24.0"
ruff = "^0.9.0"
pyright = "^1.1.350"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["*/cli/*", "*/tests/*"]
source = ["src"]

[tool.ruff]
select = ["E", "F", "C90", "I", "N", "W", "UP"]
ignore = []
line-length = 100

[tool.ruff.mccabe]
max-complexity = 10

[tool.ruff.pydocstyle]
convention = "google"

[tool.pyright]
include = ["src"]
exclude = ["**/tests"]
venvPath = "."
venv = ".venv"
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.9"
typeCheckingMode = "basic"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
